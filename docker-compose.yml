services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_priorities
    ports:
      - "5432:5432"
    volumes:
      - it-priorities-db:/var/lib/postgresql/data

  # The assistant's Codex subprocess host. The Next.js app talks to this over
  # HTTP, so the app itself stays deployable to serverless platforms.
  codex-bridge:
    build: ./services/codex-bridge
    restart: unless-stopped
    environment:
      CODEX_BRIDGE_API_KEY: local-dev-bridge-key
      CODEX_SUBSCRIPTION_HOME: /data/codex-subscriptions
    ports:
      - "8080:8080"
    volumes:
      - it-priorities-codex:/data/codex-subscriptions

volumes:
  it-priorities-db:
  it-priorities-codex:
